<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Discover the ministries supported by The Belize Project: Jacob's Farm, House of Dorcas, Restore Small Groups, and Believe in Them.">
	<title>Ministries | The Belize Project</title>
	
	<link rel="stylesheet" href="assets/css/main.css">

	<!-- Page-specific styling for the second ministry directory grid
	     (Kolbe Foundation, Hope Center, Flourish 31) — forces exactly three
	     columns on wider screens so all three sit in one row, while still
	     respecting the same mobile breakpoint main.css already uses for
	     .ministry-nav-grid, so this doesn't force a cramped 3-column layout
	     on small screens. -->
	<style>
		.ministry-nav-grid-secondary {
			grid-template-columns: repeat(3, 1fr) !important;
			max-width: 780px;
			margin: 30px auto 0;
		}
		@media (max-width: 768px) {
			.ministry-nav-grid-secondary {
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important;
				max-width: 100%;
			}
		}
	</style>
</head>
<body>
	<!-- Hook for Main Navigation -->
	<div id="site-header"></div>

	<!-- Page Header -->
	<div class="container">
		<div class="heading" style="text-align: center; margin-bottom: 40px; padding-top: 60px;">
			<h3 style="font-family: var(--font-display); font-size: 3rem; color: var(--ink);">Our <span style="color: var(--gold);">Ministries</span> and Programs</h3>
			<div class="divider" style="margin-top: 20px; margin-bottom: 40px;"></div>
		</div>

		<div class="ministry-nav-grid" id="ministry-nav-grid-primary">
			<a href="#jacob" class="ministry-nav-tile">
				<img src="assets/images/logos/jacob-logo.jpg" alt="Jacob's Farm Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Jacob+Logo'">
				<h4>Jacob's Farm</h4>
			</a>
			<a href="#dorcas" class="ministry-nav-tile">
				<img src="assets/images/logos/dorcas-logo.png" alt="House of Dorcas Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Dorcas+Logo'">
				<h4>House of Dorcas</h4>
			</a>
			<a href="#restore" class="ministry-nav-tile">
				<img src="assets/images/logos/restore-logo.png" alt="Restore Small Groups Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Restore+Logo'">
				<h4>Restore Groups</h4>
			</a>
			<a href="#bit" class="ministry-nav-tile">
				<img src="assets/images/logos/bit-logo.jpg" alt="BIT Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=BIT+Logo'">
				<h4>Believe In Them</h4>
			</a>
		</div>

		<div class="ministry-nav-grid ministry-nav-grid-secondary" id="ministry-nav-grid-secondary">
			<a href="#kolbe" class="ministry-nav-tile">
				<img src="assets/images/logos/kolbe-logo.jpg" alt="Kolbe Foundation Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Kolbe+Logo'">
				<h4>Kolbe Foundation</h4>
			</a>
			<a href="#hope-center" class="ministry-nav-tile">
				<img src="assets/images/logos/hope-logo.jpg" alt="Hope Center Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Hope+Center+Logo'">
				<h4>Hope Center</h4>
			</a>
			<a href="#flourish31" class="ministry-nav-tile">
				<img src="assets/images/logos/florish-logo.png" alt="Flourish 31 Logo" onerror="this.src='https://placehold.co/150x150/f4f4f4/c7973f?text=Flourish+31+Logo'">
				<h4>Flourish 31</h4>
			</a>
		</div>
	</div>

	<div id="ministry-sections"></div>

	<div class="container">
		<div class="heading" style="text-align: center; margin-top: 60px; margin-bottom: 40px;">
			<h3 style="font-family: var(--font-display); font-size: 3rem; color: var(--ink);">Our <span style="color: var(--gold);">Programs</span></h3>
			<div class="divider" style="margin-top: 20px; margin-bottom: 40px;"></div>
		</div>
	</div>

	<div id="program-sections"></div>

	<script>
		function buildNavTile(ministry) {
			const a = document.createElement("a");
			a.href = "#" + ministry.id;
			a.className = "ministry-nav-tile";
			const img = document.createElement("img");
			img.src = ministry.logo;
			img.alt = ministry.shortName + " Logo";
			img.onerror = function () {
				this.src = "https://placehold.co/150x150/f4f4f4/c7973f?text=" + encodeURIComponent(ministry.shortName);
			};
			const h4 = document.createElement("h4");
			h4.textContent = ministry.shortName;
			a.appendChild(img);
			a.appendChild(h4);
			return a;
		}

		function buildContentSection(entry, nameKey, subtitleKey, bgClass) {
			const section = document.createElement("section");
			section.id = entry.id;
			section.className = "ministry-section " + bgClass;
			const row = document.createElement("div");
			row.className = "ministry-row";
			const content = document.createElement("div");
			content.className = "ministry-content";
			const h2 = document.createElement("h2");
			h2.textContent = entry[nameKey];
			content.appendChild(h2);
			if (entry[subtitleKey]) {
				const h4 = document.createElement("h4");
				h4.style.cssText = "color: var(--gold); font-weight: 600; margin-top: -15px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;";
				h4.textContent = entry[subtitleKey];
				content.appendChild(h4);
			}
			const paragraphs = (entry.body || "").split(/\n\s*\n/);
			paragraphs.forEach(paraText => {
				if (!paraText.trim()) return;
				const p = document.createElement("p");
				p.textContent = paraText.trim();
				content.appendChild(p);
			});
			row.appendChild(content);
			section.appendChild(row);
			return section;
		}

		function renderMinistriesPage(data) {
			if (!data) return;

			if (Array.isArray(data.ministries) && data.ministries.length > 0) {
				const ministries = data.ministries;
				const primaryGrid = document.getElementById("ministry-nav-grid-primary");
				const secondaryGrid = document.getElementById("ministry-nav-grid-secondary");
				const sectionsContainer = document.getElementById("ministry-sections");
				if (primaryGrid) primaryGrid.innerHTML = "";
				if (secondaryGrid) secondaryGrid.innerHTML = "";
				if (sectionsContainer) sectionsContainer.innerHTML = "";

				ministries.forEach((ministry, index) => {
					const tile = buildNavTile(ministry);
					if (index < 4) {
						if (primaryGrid) primaryGrid.appendChild(tile);
					} else {
						if (secondaryGrid) secondaryGrid.appendChild(tile);
					}
					const bgClass = index % 2 === 0 ? "bg-white" : "bg-offwhite";
					if (sectionsContainer) {
						sectionsContainer.appendChild(buildContentSection(ministry, "ministryName", "ministrySubtitle", bgClass));
					}
				});
			}

			if (Array.isArray(data.programs) && data.programs.length > 0) {
				const programsContainer = document.getElementById("program-sections");
				if (programsContainer) {
					programsContainer.innerHTML = "";
					data.programs.forEach((program, index) => {
						const bgClass = index % 2 === 0 ? "bg-offwhite" : "bg-white";
						programsContainer.appendChild(buildContentSection(program, "programName", "programSubtitle", bgClass));
					});
				}
			}
		}

		fetch("assets/content/ministries.json")
			.then(response => {
				if (!response.ok) throw new Error("ministries.json not found");
				return response.json();
			})
			.then(data => renderMinistriesPage(data))
			.catch(error => {
				console.warn("Could not load ministries.json:", error);
			});
	</script>

	<!-- Hooks for Footer and Contact Modal -->
	<div id="site-footer"></div>
	<div id="site-modal"></div>

	<script src="assets/js/main.js"></script>
</body>
</html>
