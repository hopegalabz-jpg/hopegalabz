# Builds the pages from the CMS content, then deploys the site to GitHub Pages.
#
# Flow on every push to main (including every CMS "Publish"):
#   1. scripts/build.js writes assets/content/*.json into the HTML pages
#   2. if any page changed, the updated HTML is committed back to main,
#      so GitHub always shows the same text the live site shows
#   3. the site is deployed
# If a content file is invalid, step 1 fails and the live site is left as-is.
#
# Publishing several times in a row is safe: only the newest run keeps going
# (older ones show as "Cancelled" - that is expected, not an error), and each
# run builds from ALL the content on main, so nothing a cancelled run was
# carrying is lost.
name: Build and deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write lets the build commit the regenerated HTML back to main.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the older run so the
# newest content goes live as fast as possible.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is preinstalled on GitHub's runners; scripts/build.js has no
      # dependencies and needs Node 18 or newer.
      - name: Build pages from CMS content and commit them
        run: |
          set -e
          node --version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4 5; do
            node scripts/build.js
            git add index.html gala.html ministries.html resources.html gallery.html
            if git diff --cached --quiet; then
              echo "Pages already match the content files."
              pushed=true
              break
            fi
            git commit -m "Build pages from CMS content"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            # Someone published again while this run was building. Start over
            # from the newest main (the build is deterministic, so this always
            # converges) instead of failing.
            echo "::notice::main moved on (attempt $attempt); rebuilding on top of the newest content."
            git fetch origin main
            git reset --hard FETCH_HEAD
          done
          if [ "$pushed" != "true" ]; then
            echo "::warning::Could not push the updated pages to main; the live site is still deployed correctly."
          fi
          # Whatever happened above, deploy pages built from the newest content.
          node scripts/build.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5