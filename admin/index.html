!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager — The Belize Project</title>
  <!--
    This page lives at hopegala.bz/admin/, but image paths stored in the
    content files (like "assets/images/logos/jacob-logo.jpg") are written
    relative to the SITE ROOT, not this /admin/ subfolder. Without this
    <base> tag, the editor tries to load images from
    hopegala.bz/admin/assets/images/... (404) instead of
    hopegala.bz/assets/images/... (the real location). This line fixes
    every image preview in the editor at once.
  -->
  <base href="https://hopegala.bz/">
  <!--
    Decap CMS normally looks for "config.yml" next to this page
    (hopegala.bz/admin/config.yml). The <base> tag above changes what
    "relative" means on this page, which would otherwise send that
    lookup to hopegala.bz/config.yml instead (404). This line pins the
    config file to its real, full address so it keeps loading correctly.
  -->
  <link href="https://hopegala.bz/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <!--
    Decap CMS — a free, open-source, Git-based content editor.
    It reads config.yml (in this same folder) to know what content
    can be edited, then commits changes directly to the GitHub repo
    when someone clicks "Publish."

    Login uses GitHub OAuth, handled by a small proxy Worker hosted
    at hopegala-decap-proxy.hopegala.workers.dev (see config.yml's
    base_url/auth_endpoint) since GitHub requires a server-side step
    to complete OAuth login.
  -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
