<body>
  <!--
    Sveltia CMS — a free, open-source, Git-based content editor.
    It reads config.yml (in this same folder) to know what content
    can be edited, then commits changes directly to the GitHub repo
    when someone clicks "Publish."
 
    Login uses a GitHub personal access token — no separate server,
    no OAuth app, nothing else to host or maintain.
  -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
</body>
