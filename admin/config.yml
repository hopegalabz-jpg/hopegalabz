backend:
  name: github
  repo: hopegalabz-jpg/hopegalabz
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # ---------- HOMEPAGE ----------
  - name: "home"
    label: "Homepage"
    files:
      - file: "assets/content/home.json"
        label: "Homepage Content"
        name: "home"
        fields:
          - label: "Hero (Title & Subtitle)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Big Title", name: "heroHeading", widget: "string" }
              - { label: "Small Text Under Title", name: "heroSubheading", widget: "string" }
          - label: "Photo Slideshow"
            name: "slideshow_images"
            widget: "list"
            field: { label: "Photo", name: "image", widget: "image" }
          - label: "Story Video"
            name: "video"
            widget: "object"
            fields:
              - { label: "Show Video?", name: "show", widget: "boolean", default: true }
              - { label: "YouTube Video ID", name: "youtubeId", widget: "string", hint: "The part of the YouTube URL after 'v=' or 'youtu.be/'" }
              - { label: "Title Above Video", name: "videoHeading", widget: "string" }
          - label: "Why Belize Section"
            name: "whyBelize"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "whyBelizeHeading", widget: "string" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "text", widget: "text" }

  # ---------- MINISTRIES ----------
  - name: "ministries"
    label: "Ministries"
    files:
      - file: "assets/content/ministries.json"
        label: "Ministries Page"
        name: "ministries"
        fields:
          - { label: "Top Page Heading", name: "pageHeading", widget: "string" }
          - { label: "Programs Section Heading", name: "programsPageHeading", widget: "string" }
          - label: "Ministries"
            name: "ministries"
            widget: "list"
            summary: "{{fields.ministryName}}"
            fields:
              - { label: "Ministry Name", name: "ministryName", widget: "string" }
              - { label: "Short Name (used on nav tiles)", name: "shortName", widget: "string", hint: "The shorter name shown on the small tile links, e.g. 'Jacob's Farm' instead of the full 'Jacob's Rehabilitation Farm Center'." }
              - { label: "Subtitle (optional)", name: "ministrySubtitle", widget: "string", required: false }
              - { label: "Logo Image", name: "logo", widget: "image" }
              - { label: "Description", name: "body", widget: "text" }
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{fields.programName}}"
            fields:
              - { label: "Program Name", name: "programName", widget: "string" }
              - { label: "Subtitle (optional)", name: "programSubtitle", widget: "string", required: false }
              - { label: "Description", name: "body", widget: "text" }

  # ---------- RESOURCES ----------
  - name: "resources"
    label: "Resources & Documents"
    files:
      - file: "assets/content/resources.json"
        label: "Resource Categories"
        name: "resources"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Category Title", name: "title", widget: "string" }
              - { label: "Category Short Description", name: "description", widget: "string" }
              - label: "Documents"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Document Title", name: "title", widget: "string" }
                  - { label: "Document Description", name: "description", widget: "string" }
                  - { label: "File", name: "file", widget: "file" }

  # ---------- GALLERY ----------
  - name: "gallery"
    label: "Gala Photo Galleries"
    files:
      - file: "assets/content/gallery.json"
        label: "Gallery Albums"
        name: "gallery"
        fields:
          - label: "Albums"
            name: "albums"
            widget: "list"
            summary: "{{fields.year}}"
            fields:
              - { label: "Album Name", name: "year", widget: "string" }
              - label: "Album Type"
                name: "category"
                widget: "select"
                options: [ { label: "Gala Night", value: "gala" }, { label: "Ministry", value: "ministry" } ]
                default: "gala"
              - { label: "Folder Name", name: "folder", widget: "string", hint: "Only set this when creating a brand-new album." }
              - { label: "Cover Photo", name: "coverImage", widget: "image" }
              - label: "Photos"
                name: "images"
                widget: "list"
                field: { label: "Photo", name: "image", widget: "image", hint: "Tip: resize photos under 2MB before uploading." }

  # ---------- GALA PAGE ----------
  - name: "gala"
    label: "Gala Event Page"
    files:
      - file: "assets/content/gala.json"
        label: "Gala Page Settings"
        name: "gala"
        fields:
          - { label: "'Ministries You Support' Heading", name: "ministriesSupportHeading", widget: "string", hint: "The tiles below this automatically show whatever ministries are set up on the Ministries page — edit them there, not here." }
          - label: "Hero (Top of Page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date & Location Line", name: "dateLocation", widget: "string" }
              - { label: "Pledge Button Text", name: "pledgeButtonText", widget: "string" }
          - label: "Purpose & Praise Section"
            name: "purposeSection"
            widget: "object"
            fields:
              - { label: "Heading", name: "purposeHeading", widget: "string" }
              - label: "Paragraphs"
                name: "purposeParagraphs"
                widget: "list"
                field: { label: "Paragraph", name: "text", widget: "text" }
          - label: "Countdown"
            name: "countdown"
            widget: "object"
            fields:
              - { label: "Show Countdown?", name: "show", widget: "boolean", default: false }
              - { label: "Event Date & Time", name: "targetDate", widget: "datetime" }
          - label: "Sponsorship Section"
            name: "sponsorship"
            widget: "object"
            fields:
              - { label: "Show Sponsorship?", name: "show", widget: "boolean", default: false }
              - label: "Tiers"
                name: "tiers"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Tier Name", name: "name", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - label: "Perks"
                    name: "perks"
                    widget: "list"
                    field: { label: "Perk", name: "perk", widget: "string" }
          - label: "Faithful Stewardship Section"
            name: "stewardshipSection"
            widget: "object"
            fields:
              - { label: "Heading", name: "stewardshipHeading", widget: "string" }
              - label: "Paragraphs"
                name: "stewardshipParagraphs"
                widget: "list"
                field: { label: "Paragraph", name: "text", widget: "text" }
          - label: "Pledge / Donation Info"
            name: "pledge"
            widget: "object"
            fields:
              - { label: "Bible Verse Text", name: "verseText", widget: "string" }
              - { label: "Bible Verse Reference", name: "verseReference", widget: "string" }
              - { label: "Pledge Modal Title", name: "modalTitle", widget: "string" }
              - { label: "Thank You Message", name: "thanksText", widget: "text" }
              - { label: "Bank Name", name: "bankName", widget: "string" }
              - { label: "Bank Account Name", name: "bankAccountName", widget: "string" }
              - { label: "Bank Account Number", name: "bankAccountNumber", widget: "string" }
              - { label: "Check Instructions", name: "checkInstruction", widget: "text" }
              - { label: "Contacts Intro Text", name: "contactsIntro", widget: "string" }
              - label: "Contact People"
                name: "contacts"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Contact Email", name: "email", widget: "string" }
