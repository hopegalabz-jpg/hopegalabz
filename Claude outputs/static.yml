# Builds the pages from the CMS content, then deploys the site to GitHub Pages.
#
# Flow on every push to main (including every CMS "Publish"):
#   1. scripts/build.js writes assets/content/*.json into the HTML pages
#   2. if any page changed, the updated HTML is committed back to main,
#      so GitHub always shows the same text the live site shows
#   3. the site is deployed
# If a content file is invalid, step 1 fails and the live site is left as-is.
name: Build and deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write lets the build commit the regenerated HTML back to main.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build pages from CMS content
        run: node scripts/build.js

      # Commits made with the built-in token do not start another workflow run,
      # so this cannot loop. The message makes these commits easy to spot.
      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gala.html ministries.html resources.html gallery.html
          if git diff --cached --quiet; then
            echo "Pages already match the content files."
          else
            git commit -m "Build pages from CMS content"
            # If the push is refused (for example by a branch-protection rule),
            # deploy anyway: the live site is built from this working copy.
            git push || echo "::warning::Could not push the updated pages to main; the live site is still deployed correctly."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
