<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gallery | The Belize Project</title>
	
	<!-- THE FIX: Pointing to the correct main CSS file -->
	<link rel="stylesheet" type="text/css" href="assets/css/main.css">

	<!-- ==========================================================================
	     GALLERY-ONLY STYLES
	     ==========================================================================
	     Moved out of main.css because these rules are used by this page only.
	     main.css keeps only what's genuinely shared: .container, .heading, and
	     the base sidebar shell (.sidebar-overlay, .premium-sidebar, .sidebar-
	     header, .sidebar-content, .close-sidebar-btn), since Resources' own
	     openResourceCategory() reuses that same shell. Everything below — the
	     album tiles, the sidebar's photo-list variant, and the lightbox —
	     exists only here.
	     ========================================================================== -->
	<style>
		.album-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; padding: 20px 0 40px 0; }
		.album-tile { position: relative; background: var(--dark-bg); border: 1px solid rgba(212, 175, 55, 0.3); padding: 8px; cursor: pointer; overflow: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.4); opacity: 0; transform: translateY(18px); animation: tile-rise 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
		.album-tile::before, .album-tile::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--gold-premium); z-index: 2; opacity: 0.6; transition: all 0.4s ease; }
		.album-tile::before { top: 5px; left: 5px; border-right: 0; border-bottom: 0; }
		.album-tile::after { bottom: 5px; right: 5px; border-left: 0; border-top: 0; }
		.album-tile:hover { transform: translateY(-4px); border-color: var(--gold-premium); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.15); }
		.album-tile:hover::before, .album-tile:hover::after { opacity: 1; width: 14px; height: 14px; }

		@keyframes tile-rise { to { opacity: 1; transform: translateY(0); } }
		.album-tile:nth-child(1) { animation-delay: 0.05s; }
		.album-tile:nth-child(2) { animation-delay: 0.1s; }
		.album-tile:nth-child(3) { animation-delay: 0.15s; }
		.album-tile:nth-child(4) { animation-delay: 0.2s; }
		.album-tile:nth-child(5) { animation-delay: 0.25s; }
		.album-tile:nth-child(6) { animation-delay: 0.3s; }
		.album-tile:nth-child(7) { animation-delay: 0.35s; }
		.album-tile:nth-child(8) { animation-delay: 0.4s; }
		.album-tile:nth-child(n+9) { animation-delay: 0.45s; }

		.album-cover-wrapper { width: 100%; height: 240px; overflow: hidden; position: relative; }
		.album-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
		.album-tile:hover .album-cover-wrapper img { transform: scale(1.05); }

		.album-cover-wrapper::after {
			content: ''; position: absolute; inset: 0;
			background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0) 100%);
			opacity: 0; transition: opacity 0.4s ease;
		}
		.album-tile:hover .album-cover-wrapper::after { opacity: 1; }
		.album-cover-wrapper .view-gallery-prompt {
			position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
			color: var(--gold-premium); font-family: var(--font-display); font-size: 0.85rem;
			font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em;
			opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease;
			z-index: 1; pointer-events: none;
		}
		.album-tile:hover .view-gallery-prompt { opacity: 1; transform: translateY(0); }

		.album-info { padding: 12px 5px 3px; text-align: center; }
		.album-info h4 { margin: 0; font-size: 1.15rem; color: #ffffff; font-family: var(--font-display); }
		.album-info h4 span { color: var(--gold-premium); }
		.album-info p { margin: 3px 0 0; font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; }

		.sidebar-gallery { display: flex; flex-direction: column; gap: 12px; }
		.sidebar-gallery img { width: 100%; height: auto; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: all 0.25s ease; }
		.sidebar-gallery img:hover { transform: scale(1.015); border-color: var(--gold-premium); }

		.lightbox { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.94); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
		.lightbox.active { opacity: 1; visibility: visible; }
		.lightbox img { max-width: 88%; max-height: 82%; box-shadow: 0 0 25px rgba(0,0,0,0.7); border: 1px solid rgba(212, 175, 55, 0.4); transition: opacity 0.25s ease-in-out, transform 0.25s ease; opacity: 1; }
		.lightbox img.fade-out { opacity: 0; transform: scale(0.98); }
		.lightbox-close { position: absolute; top: 20px; right: 30px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 50%; color: #fff; font-size: 2.3rem; line-height: 1; cursor: pointer; z-index: 2001; transition: background 0.2s ease, border-color 0.2s ease; }
		.lightbox-close:hover { color: var(--gold-premium); background: rgba(0, 0, 0, 0.7); border-color: var(--gold-premium); }
		.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.4); color: rgba(255, 255, 255, 0.6); border: 1px solid rgba(212, 175, 55, 0.15); font-size: 1.8rem; padding: 12px 18px; cursor: pointer; z-index: 2001; transition: all 0.25s ease; border-radius: 4px; }
		.lightbox-nav:hover { background: rgba(212, 175, 55, 0.75); color: #fff; border-color: var(--gold-premium); }
		.lightbox-nav.prev { left: 25px; }
		.lightbox-nav.next { right: 25px; }

		@media (max-width: 768px) {
			.lightbox-nav { padding: 8px 12px; font-size: 1.3rem; background: rgba(0, 0, 0, 0.3); border-color: rgba(212, 175, 55, 0.1); }
			.lightbox-nav.prev { left: 10px; }
			.lightbox-nav.next { right: 10px; }
			.lightbox-close { top: 14px; right: 14px; width: 42px; height: 42px; font-size: 2rem; }
		}
	</style>
</head>
<body>
	<!-- Hook for Main Navigation -->
	<div id="site-header"></div>
	
	<div class="container">
		<!-- Beautiful Top Section Header -->
		<div class="heading" style="text-align: center; margin-bottom: 40px; padding-top: 40px;">
			<h3 style="font-family: var(--font-display); font-size: 2.5rem; color: var(--ink);">The Belize Project <span style="color: var(--gold);">Media Galleries</span></h3>
		</div>

		<!-- ELEGANT ALBUM TILE GRID — built by JavaScript from gallery.json.
		     See the render script near the bottom of this file. -->
		<div class="album-grid" id="album-grid"></div>

	</div> <!-- This closes the container -->

	<!-- SLIDE OUT SIDEBAR OVERLAY COMPONENT -->
	<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeAlbum()">
		<div class="premium-sidebar" onclick="event.stopPropagation()">
			<div class="sidebar-header">
				<h3 id="sidebarTitle">Hope Gala <span>2025</span></h3>
				<button class="close-sidebar-btn" onclick="closeAlbum()">&times;</button>
			</div>
			<div class="sidebar-content">
				<div class="sidebar-gallery" id="sidebarGalleryItems">
					<!-- Images loaded dynamically via JS -->
				</div>
			</div>
		</div>
	</div>

	<!-- LIGHTBOX ZOOM OVERLAY COMPONENT (With updated Navigation) -->
	<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
		<span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
		
		<!-- Navigation Arrows -->
		<button class="lightbox-nav prev" onclick="changeImage(-1, event)">&#10094;</button>
		
		<img id="lightboxImg" src="" alt="Expanded View">
		
		<button class="lightbox-nav next" onclick="changeImage(1, event)">&#10095;</button>
	</div>

	<!-- Hooks for Footer and Contact Modal -->
	<div id="site-footer"></div>
	<div id="site-modal"></div>
	
	<!-- THE FIX: Pointing to the correct main JS file -->
	<script src="assets/js/main.js"></script>

	<!-- ==========================================================================
	     GALLERY-ONLY SCRIPT
	     ==========================================================================
	     Moved out of main.js because this logic is used by this page only.
	     main.js stays universal: header/footer/modal injection, the contact
	     form, and the shared sidebar shell (closeAlbum(), plus the click-
	     outside-to-close listener) that Resources' own openResourceCategory()
	     also relies on. Everything below — the photo-album data arrays, the
	     lightbox, and openAlbum() itself (which only this page ever calls) —
	     exists only here.
	     ========================================================================== -->
	<script>
		// ==========================================================================
		// GALLERY CONTENT LOADER
		// ==========================================================================
		// Albums and photos come from gallery.json — see the fetch call at the
		// bottom of this script. Every image path in that file is a full path
		// (e.g. "assets/images/gala-night-2025/1.jpg"), so these functions use
		// paths directly rather than combining a separate folder + filename.

		let currentAlbumList = [];   // full image paths for whichever album is open
		let currentImageIndex = 0;

		function buildAlbumTile(album) {
			const tile = document.createElement('div');
			tile.className = 'album-tile';
			tile.onclick = function () { openAlbum(album); };

			const coverWrapper = document.createElement('div');
			coverWrapper.className = 'album-cover-wrapper';
			const coverImg = document.createElement('img');
			coverImg.src = album.coverImage;
			coverImg.alt = album.year + ' Cover';
			coverImg.loading = 'lazy';
			coverWrapper.appendChild(coverImg);

			const info = document.createElement('div');
			info.className = 'album-info';
			const h4 = document.createElement('h4');
			h4.textContent = album.year;
			const p = document.createElement('p');
			p.textContent = album.category === 'ministry' ? 'Ministries' : 'Fundraising Event';
			info.appendChild(h4);
			info.appendChild(p);

			tile.appendChild(coverWrapper);
			tile.appendChild(info);
			return tile;
		}

		function renderGalleryPage(data) {
			const grid = document.getElementById('album-grid');
			if (!grid || !data || !Array.isArray(data.albums)) return;

			grid.innerHTML = '';
			data.albums.forEach(album => {
				grid.appendChild(buildAlbumTile(album));
			});
		}

		function openAlbum(album) {
			// album.images is a list of { image: "full/path.jpg" } objects
			currentAlbumList = album.images.map(item => item.image);

			const overlay = document.getElementById('sidebarOverlay');
			const titleContainer = document.getElementById('sidebarTitle');
			const galleryContainer = document.getElementById('sidebarGalleryItems');

			titleContainer.textContent = album.year;
			galleryContainer.innerHTML = '';

			currentAlbumList.forEach((path, index) => {
				const img = document.createElement('img');
				img.src = path;
				img.loading = 'lazy';
				img.alt = 'Gala Media File';

				img.onclick = function () {
					openLightbox(index);
				};

				galleryContainer.appendChild(img);
			});

			overlay.classList.add('active');
			document.body.style.overflow = 'hidden';
		}

		function openLightbox(index) {
			currentImageIndex = index;
			const lightboxImg = document.getElementById('lightboxImg');

			// Set the initial image immediately upon opening without fade
			lightboxImg.src = currentAlbumList[currentImageIndex];
			lightboxImg.classList.remove('fade-out');

			document.getElementById('lightbox').classList.add('active');
		}

		function updateLightboxImage() {
			const lightboxImg = document.getElementById('lightboxImg');

			lightboxImg.classList.add('fade-out');

			setTimeout(() => {
				lightboxImg.src = currentAlbumList[currentImageIndex];
				lightboxImg.classList.remove('fade-out');
			}, 200);
		}

		function changeImage(direction, event) {
			if (event) event.stopPropagation();

			currentImageIndex += direction;

			if (currentImageIndex < 0) {
				currentImageIndex = currentAlbumList.length - 1;
			} else if (currentImageIndex >= currentAlbumList.length) {
				currentImageIndex = 0;
			}

			updateLightboxImage();
		}

		// Closes ONLY via the explicit close button or Escape. The lightbox div's
		// onclick above still calls this function on every click inside it
		// (backdrop, photo, everywhere) — so this function refuses to act
		// unless it was called with no event at all (Escape key) or an event
		// whose target is exactly the close button itself.
		function closeLightbox(event) {
			if (event && event.target.className !== 'lightbox-close') return;
			document.getElementById('lightbox').classList.remove('active');
		}

		// Touch swipe navigation for the lightbox (mobile only in practice,
		// since desktop pointers don't fire touch events). Reuses changeImage()
		// — the same function the desktop prev/next arrows call — so swiping
		// and clicking always stay in sync with no separate navigation logic
		// to maintain.
		let swipeStartX = 0;
		const SWIPE_MIN_DISTANCE = 50; // px — below this, treat it as a tap, not a swipe

		const lightboxEl = document.getElementById('lightbox');
		if (lightboxEl) {
			lightboxEl.addEventListener('touchstart', function(event) {
				swipeStartX = event.changedTouches[0].clientX;
			}, { passive: true });

			lightboxEl.addEventListener('touchend', function(event) {
				const swipeEndX = event.changedTouches[0].clientX;
				const distance = swipeEndX - swipeStartX;

				if (Math.abs(distance) < SWIPE_MIN_DISTANCE) return; // was a tap, not a swipe

				if (distance < 0) {
					changeImage(1); // swiped left → next photo
				} else {
					changeImage(-1); // swiped right → previous photo
				}
			}, { passive: true });
		}

		// Keyboard navigation for the lightbox specifically. The sidebar's own
		// Escape-to-close behavior stays in main.js (shared with Resources);
		// this listener only ever handles the lightbox, which is gallery-only.
		document.addEventListener('keydown', function(event) {
			const lightbox = document.getElementById('lightbox');
			if (lightbox && lightbox.classList.contains('active')) {
				if (event.key === 'ArrowRight') {
					changeImage(1);
				} else if (event.key === 'ArrowLeft') {
					changeImage(-1);
				} else if (event.key === 'Escape') {
					closeLightbox();
				}
			}
		});

		// Fetch the album/photo data and render the tile grid. If this fails,
		// the grid stays empty rather than showing stale or broken content —
		// a clear sign to check gallery.json rather than a silently broken page.
		fetch('assets/content/gallery.json')
			.then(response => {
				if (!response.ok) throw new Error('gallery.json not found');
				return response.json();
			})
			.then(data => renderGalleryPage(data))
			.catch(error => {
				console.warn('Could not load gallery.json — no albums will display:', error);
			});
	</script>
</body>
</html>
